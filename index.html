<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<title>Happy Home Cards</title>
<style>
html{height:100%}
body{font-family:'Atkinson Hyperlegible',sans-serif;background:linear-gradient(135deg,#f0f4f8 0%,#e8f1f6 100%);padding:20px;text-align:center;margin:0;position:relative;overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.7) 2px, transparent 2px);background-size:60px 60px;opacity:.35;pointer-events:none;z-index:0}
header{margin-bottom:30px;display:flex;align-items:center;justify-content:center;gap:20px;position:relative;z-index:1;flex-wrap:wrap}
.logo{max-width:200px;height:auto}
.logo img{max-width:100%;height:auto;display:block}
h1{margin:0;color:#0078d4}
.categories{display:flex;flex-wrap:wrap;justify-content:center;gap:40px;margin:50px 0;max-width:1400px;margin-left:auto;margin-right:auto;position:relative;z-index:1}
.category-btn{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform 0.2s;text-decoration:none;color:inherit;flex:0 0 calc(25% - 30px)}
.category-btn:hover{transform:scale(1.08)}
.category-btn img{width:100%;max-width:320px;height:280px;border-radius:15px;object-fit:cover;box-shadow:0 6px 15px rgba(0,0,0,0.3);margin-bottom:20px}
.category-btn span{font-weight:bold;font-size:22px;color:#1b5c8e;text-align:center;max-width:280px}
button{background:#1b5c8e;color:#fff;border:none;border-radius:8px;padding:10px 16px;margin:5px;cursor:pointer}
button:focus,.category-btn:focus{outline:3px solid #ffbf47;outline-offset:2px}button:disabled{opacity:.55;cursor:not-allowed}
#cards{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;position:relative;z-index:1}
.card{width:500px;height:360px;perspective:1200px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:.8s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.back{transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:cover}
.art{height:270px}.art img{height:100%;width:100%;object-fit:cover}
.title{padding:10px;font-size:22px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:10px}
.title span{flex:1;text-align:left}
.favourite,.disliked{border:5px solid gold!important;box-shadow:0 0 25px gold!important}
.report{background:#fff;padding:12px;margin:10px auto;max-width:900px;border-radius:10px;text-align:left;position:relative;z-index:1}
.shuffle{display:none;font-size:24px;padding:20px;text-align:center}
.shuffle.active{display:block;animation:shuffle-pulse 0.6s infinite}
.session-item{margin:10px 0;padding:10px;background:#f9f9f9;border-left:4px solid #1b5c8e}
.response-item{margin:10px 0;padding:10px;background:#f9f9f9;border-left:4px solid #27ae60}
.card-buttons{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex:1}
.card-buttons button{padding:5px 10px;font-size:16px;margin:0}
.welcome-screen{max-width:900px;margin:40px auto 20px;background:#fff;padding:30px 24px;border-radius:20px;box-shadow:0 8px 25px rgba(0,0,0,.12);position:relative;z-index:1}
.welcome-screen h2{margin-top:0;color:#1b5c8e;font-size:34px}
.welcome-screen p,.welcome-screen li{font-size:20px;line-height:1.5}
.welcome-screen ul{text-align:left;display:inline-block;margin:10px auto 25px;padding-left:22px;max-width:700px}
.welcome-screen .start-actions{margin-top:20px}
.welcome-screen .play-button{font-size:24px;padding:16px 32px;border-radius:999px;background:#27ae60}
.complete-message{margin-top:16px;font-size:18px;color:#1b5c8e;font-weight:700}
@keyframes shuffle-pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-15px)}50%{transform:translateX(15px)}75%{transform:translateX(-15px)}100%{transform:translateX(0)}}
@media(max-width:600px){.category-btn{flex:0 0 calc(100% - 20px)}.card{width:100%}.welcome-screen h2{font-size:28px}.welcome-screen p,.welcome-screen li{font-size:18px}}
</style>
</head>
<body>
<header>
<div class="logo">
<img src="https://raw.githubusercontent.com/learningdmhlwb/happy-home-cards/main/disability%20logo.png" alt="Life Without Barriers logo" onerror="this.onerror=null;this.src='https://placehold.co/200x80?text=Logo';"/>
</div>
<h1>Happy Home Cards</h1>
</header>
<div id="app"></div>
<script>
var imageBase='https://raw.githubusercontent.com/learningdmhlwb/happy-home-cards/main/';
var fallbackImageBase='https://placehold.co/900x600?text=Image+Missing';
var responses=[];
var favourites=[];
var dislikes=[];
var sessionHistory=[];
var currentCategory=null;
var revealedCards={};
var playLocked=false;
var cardBacks={
  'My Home':'cardback-myhome.jpeg',
  'Things I Do':'cardback-thingsido.jpeg',
  'Things I Like':'cardback-thingsilike.jpeg',
  'Things I Do Not Like':'cardback-thingsidonotlike.jpeg'
};
var decks={
   'My Home':[{t:'Eat together',i:'eat-together.jpeg'},{t:'Share the housework',i:'share-the-housework.jpeg'},{t:'Shop for food together',i:'shop-for-food-together.jpeg'},{t:'Have fun together',i:'have-fun-together.jpeg'},{t:'Enjoy leisure time',i:'enjoy-leisure-time.jpeg'},{t:'Celebrate together',i:'celebrate-together.jpeg'},{t:'Share a meal',i:'share-a-meal.jpeg'},{t:'Watch TV together',i:'watch-tv-together.jpeg'},{t:'Help and support each other',i:'help-and-support-each-other.jpeg'},{t:'Spend time together',i:'spend-time-together.jpeg'}],
  'Things I Do':[{t:'Work',i:'work.jpeg'},{t:'Study',i:'study.jpeg'},{t:'Appointments',i:'appointments.jpeg'},{t:'Day Program',i:'day-program.jpeg'},{t:'Do things with other people',i:'do-things-with-other-people.jpeg'},{t:'Shopping',i:'shopping.jpeg'},{t:'Exercise or sports',i:'exercise-or-sports.jpeg'},{t:'Hobbies and interests',i:'hobbies-and-interests.jpeg'},{t:'Travel',i:'travel.jpeg'},{t:'Help in the community',i:'help-in-the-community.jpeg'}],
  'Things I Like':[{t:'Cooking',i:'cooking.jpeg'},{t:'Reading',i:'reading.jpeg'},{t:'Pets',i:'pets.jpeg'},{t:'Watch or play sports',i:'watch-or-play-sports.jpeg'},{t:'Watch a TV Show or movie',i:'watch-a-tv-show-or-movie.jpeg'},{t:'Gardening',i:'gardening.jpeg'},{t:'Music',i:'music.jpeg'},{t:'Art and craft',i:'art-and-craft.jpeg'},{t:'Going out',i:'going-out.jpeg'},{t:'Spending time with family',i:'spending-time-with-family.jpeg'}],
  'Things I Do Not Like':[{t:'Smoking',i:'smoking.jpeg'},{t:'Being too noisy',i:'being-too-noisy.jpeg'},{t:'Leaving me out of things',i:'leaving-me-out-of-things.jpeg'},{t:'Not helping with housework',i:'not-helping-with-housework.jpeg'},{t:'Drinking alcohol',i:'drinking-alcohol.jpeg'},{t:'Being disrespectful',i:'being-disrespectful.jpeg'},{t:'Messy spaces',i:'messy-spaces.jpeg'},{t:'People not listening',i:'people-not-listening.jpeg'},{t:'Being too cold',i:'being-too-cold.jpeg'},{t:'Being too hot',i:'being-too-hot.jpeg'}]
};
var app=document.getElementById('app');
var unseenCards={};

function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch];});}
function imgTag(src, alt, cls){return '<img class="'+(cls||'')+'" src="'+src+'" alt="'+escapeHtml(alt)+'" onerror="this.onerror=null;this.src=\''+fallbackImageBase+'\';this.alt=\''+escapeHtml(alt)+' image failed to load\'"/>';}
function welcome(){
var h='<section class="welcome-screen"><h2>Welcome!</h2><p>Use Happy Home Cards to explore choices, talk about what matters, and build a plan together.</p><p><strong>How to use it:</strong></p><ul><li>Select a category to start</li><li>Flip each card to see the picture and title</li><li>Mark cards as favourite or things you do not like</li><li>Add reflections about why things matter</li><li>Use the report to see your choices and feedback</li></ul><div class="start-actions"><button class="play-button" id="playBtn">Start Exploring</button></div></section>';
app.innerHTML=h;
document.getElementById('playBtn').onclick=home;
}
function home(currentCategory=null, playLocked=false){
var h='<h2>Select Category</h2><div class="categories">';
for(var k in decks){
if(Object.prototype.hasOwnProperty.call(decks,k)){
var backSrc=imageBase+cardBacks[k];
h+='<div class="category-btn" tabindex="0" role="button" aria-label="Open '+escapeHtml(k)+'" onclick="draw(\''+k+'\')" onkeydown="if(event.key===\'Enter\' || event.key===\' \'){event.preventDefault();draw(\''+k+'\');}">'+imgTag(backSrc,k,'')+'<span>'+escapeHtml(k)+'</span></div>';
}
}
h+='</div><div><button id="rep">Report</button></div>';
app.innerHTML=h;
document.getElementById('rep').onclick=report;
}
function draw(cat){currentCategory=cat;unseenCards[cat]=decks[cat].slice();playLocked=false;app.innerHTML='<h2>'+escapeHtml(cat)+'</h2><div class="shuffle">🎲 Shuffling Cards...</div>';setTimeout(function(){showNextCard(cat);},800);}
function stopShuffleAnimation(){var shuffleEl=document.querySelector('.shuffle');if(shuffleEl){shuffleEl.classList.remove('active');shuffleEl.remove();}}
function showNextCard(cat){try{
if(!decks[cat]) throw new Error('Category not found');
if(!unseenCards[cat]||unseenCards[cat].length===0){
playLocked=true;
var h='<h2>'+escapeHtml(cat)+'</h2><div class="report" style="text-align:center;"><h3 class="complete-message">All cards in this category have been revealed!</h3><button id="homeBtn">Back to Categories</button></div>';
app.innerHTML=h;
document.getElementById('homeBtn').onclick=home;
return;
}
var arr=unseenCards[cat].slice(0,2);unseenCards[cat].splice(0,2);if(arr.length>0){if(sessionHistory.length===0||sessionHistory[sessionHistory.length-1].category!==cat){sessionHistory.push({category:cat,cards:[]});}
sessionHistory[sessionHistory.length-1].cards=sessionHistory[sessionHistory.length-1].cards.concat(arr.map(function(c){return c.t;}));}
var h='<h2>'+escapeHtml(cat)+'</h2><div class="shuffle">🎲 Shuffling Cards...</div><div id="cards">';
for(var i=0;i<arr.length;i++){
var c=arr[i];
var frontSrc=imageBase+(cardBacks[cat]||'');
var backSrc=imageBase+c.i;
h+='<div class="card" role="button" tabindex="0" aria-label="Flip card '+escapeHtml(c.t)+'"><div class="inner"><div class="face front">'+imgTag(frontSrc,'Card Back','')+'</div><div class="face back"><div class="art">'+imgTag(backSrc,c.t,'')+'</div><div class="title"><span>'+escapeHtml(c.t)+'</span><div class="card-buttons"><button class="speak" aria-label="Speak '+escapeHtml(c.t)+'">🔊</button><button class="preference-btn" data-action="like" aria-label="Mark '+escapeHtml(c.t)+' as favourite">❤️</button><button class="preference-btn" data-action="dislike" aria-label="Mark '+escapeHtml(c.t)+' as disliked">👎</button></div></div></div></div></div>';
}
var cardsRemaining=unseenCards[cat].length;var nextButtonText=cardsRemaining>0?'🎲 Next Cards ('+cardsRemaining+' remaining)':'View Report';
h+='</div><div id="actionsRow"><button id="reflect">Reflection</button><button id="reshuffle" '+(cardsRemaining===0?'disabled':'')+'">'+nextButtonText+'</button><button id="homeBtn" '+(cardsRemaining===0?'':'')+'">Back to Categories</button></div>';
app.innerHTML=h;
setTimeout(function(){stopShuffleAnimation();},800);
var cards=document.querySelectorAll('.card');
for(var i=0;i<cards.length;i++){cards[i].onclick=function(){if(playLocked||this.classList.contains('flipped'))return;this.classList.toggle('flipped');};cards[i].onkeydown=function(e){if(e.key==='Enter' || e.key===' '){e.preventDefault();this.classList.toggle('flipped');}};}
var speaks=document.querySelectorAll('.speak');
for(var j=0;j<speaks.length;j++){speaks[j].onclick=function(e){e.stopPropagation();if('speechSynthesis' in window){speechSynthesis.cancel();var text=this.closest('.title').querySelector('span').textContent;speechSynthesis.speak(new SpeechSynthesisUtterance(text));}};}
var preferences=document.querySelectorAll('.preference-btn');
for(var m=0;m<preferences.length;m++){preferences[m].onclick=function(e){e.stopPropagation();var card=this.closest('.card');var action=this.getAttribute('data-action');var selectedClass=action==='like'?'favourite':'disliked';var title=card.querySelector('.title span').textContent;if(card.classList.contains(selectedClass)){card.classList.remove(selectedClass);if(action==='like'){favourites=favourites.filter(function(f){return f!==title;});}else{dislikes=dislikes.filter(function(d){return d!==title;});}}else{card.classList.add(selectedClass);if(action==='like'){if(!favourites.includes(title))favourites.push(title);}else{if(!dislikes.includes(title))dislikes.push(title);}}};}
document.getElementById('reflect').onclick=function(){var r=prompt('Why is this important?');if(r){responses.push({category:cat,text:r,date:new Date().toLocaleString()});}};
document.getElementById('reshuffle').onclick=function(){if(playLocked||unseenCards[cat].length===0)return;playLocked=true;app.innerHTML='<h2>'+escapeHtml(cat)+'</h2><div class="shuffle active">🎲 Shuffling Cards...</div>';setTimeout(function(){showNextCard(cat);},800);};
document.getElementById('homeBtn').onclick=function(){if(cardsRemaining===0){home();}};
playLocked=false;
}catch(err){app.innerHTML='<h2>Error</h2><p>'+escapeHtml(err.message)+'</p>';}}
function report(){
var h='<h2>Participant Summary Report</h2>';
h+='<div class="report"><h3>Favourite Cards</h3>'+(favourites.length?escapeHtml(favourites.join(', ')):'None selected')+'</div>';
h+='<div class="report"><h3>Disliked Cards (Things I Do Not Like)</h3>'+(dislikes.length?escapeHtml(dislikes.join(', ')):'None selected')+'</div>';
h+='<div class="report"><h3>Session History</h3>';
if(sessionHistory.length>0){
for(var i=0;i<sessionHistory.length;i++){
h+='<div class="session-item"><strong>'+escapeHtml(sessionHistory[i].category)+':</strong> '+escapeHtml(sessionHistory[i].cards.join(', '))+'</div>';
}
}else{
h+='<div class="session-item">No sessions recorded</div>';
}
h+='</div>';
h+='<div class="report"><h3>Responses</h3>';
if(responses.length>0){
for(var r=0;r<responses.length;r++){
h+='<div class="response-item"><strong>'+escapeHtml(responses[r].category)+' ('+escapeHtml(responses[r].date)+'):</strong> '+escapeHtml(responses[r].text)+'</div>';
}
}else{
h+='<div class="response-item">No reflections recorded</div>';
}
h+='</div>';
h+='<div style="text-align:center;margin-top:20px;"><button id="backBtn">Back to Home</button></div>';
app.innerHTML=h;
document.getElementById('backBtn').onclick=home;
}
welcome();
</script>
</body>
</html>
