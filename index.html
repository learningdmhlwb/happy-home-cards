<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Home Cards</title>
<style>
body{font-family:Aptos,sans-serif;background:#ebebeb;padding:20px;text-align:center;margin:0}
header{margin-bottom:30px;display:flex;align-items:center;justify-content:center;gap:20px}
.logo{max-width:200px;height:auto}
.logo img{max-width:100%;height:auto;display:block}
h1{margin:0;color:#0078d4}
button{background:#1b5c8e;color:#fff;border:none;border-radius:8px;padding:10px 16px;margin:5px;cursor:pointer}
#cards{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.card{width:500px;height:360px;perspective:1200px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:.8s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.back{transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:cover}
.art{height:270px}.art img{height:100%;width:100%;object-fit:cover}
.title{padding:10px;font-size:22px;font-weight:bold}
.favourite{border:5px solid gold!important;box-shadow:0 0 25px gold!important}
.report{background:#fff;padding:12px;margin:10px auto;max-width:900px;border-radius:10px;text-align:left}
.shuffle{font-size:28px;animation:shake .4s 5}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-15px)}50%{transform:translateX(15px)}75%{transform:translateX(-15px)}100%{transform:translateX(0)}}
</style>
</head>
<body>
<header>
<div class="logo">
<img src="disability logo.png" alt="Life Without Barriers logo">
</div>
<h1>Happy Home Cards Version 10.3</h1>
</header>
<div id="app"></div>
<script>
var imageBase='';
var responses=[];
var favourites=[];
var sessionHistory=[];
var cardBacks={
 'My Home':'cardback-myhome.jpeg',
 'Things I Do':'cardback-thingsido.jpeg',
 'Things I Like':'cardback-thingsilike.jpeg',
 'Things I Do Not Like':'cardback-thingsidonotlike.jpeg'
};
var decks={
 'My Home':[{t:'Eat Together',i:'image27.jpeg'},{t:'Share the Housework',i:'image28.jpeg'},{t:'Shop for Food Together',i:'image29.jpeg'}],
 'Things I Do':[{t:'Work',i:'image36.jpeg'},{t:'Study',i:'image37.jpeg'},{t:'Appointments',i:'image38.jpeg'}],
 'Things I Like':[{t:'Cooking',i:'image43.jpeg'},{t:'Reading',i:'image56.jpeg'},{t:'Pets',i:'image57.jpeg'},{t:'Watch or Play Sports',i:'image58.jpeg'}],
 'Things I Do Not Like':[{t:'Smoking',i:'image59.jpeg'},{t:'Being Too Noisy',i:'image66.jpeg'}]
};
var app=document.getElementById('app');
function home(){var h='<h2>Select Category</h2>';for(var k in decks){h+='<button data-cat="'+k+'">'+k+'</button>';}h+='<div><button id="rep">Report</button></div>';app.innerHTML=h;var btns=document.querySelectorAll('button[data-cat]');for(var i=0;i<btns.length;i++){btns[i].onclick=function(){draw(this.getAttribute('data-cat'));};}document.getElementById('rep').onclick=report;}
function draw(cat){app.innerHTML='<h2>'+cat+'</h2><div class="shuffle">🎲 Shuffling Cards...</div>';setTimeout(function(){showCards(cat);},1200);}
function showCards(cat){try{
if(!decks[cat]) throw new Error('Category not found');
var arr=decks[cat].slice();arr.sort(function(){return Math.random()-0.5;});arr=arr.slice(0,2);
if(arr.length>0){sessionHistory.push({category:cat,cards:arr.map(function(c){return c.t;})});}
var h='<h2>'+cat+'</h2><div id="cards">';
for(var i=0;i<arr.length;i++){
var c=arr[i];
h+='<div class="card"><div class="inner"><div class="face front"><img src="'+imageBase+cardBacks[cat]+'" alt="Card Back"></div><div class="face back"><div class="art"><img src="'+imageBase+c.i+'" alt="'+c.t+'"></div><div class="title">'+c.t+'<button class="speak" data-text="'+c.t+'" title="Speak">🔊</button><button class="fav" data-title="'+c.t+'" title="Add to Favourites">⭐</button></div></div></div></div>';
}
h+='</div><button id="reflect">Reflection</button><button id="reshuffle">🎲 Shuffle New Cards</button><button id="homeBtn">Home</button>';
app.innerHTML=h;
var cards=document.querySelectorAll('.card');
for(i=0;i<cards.length;i++){cards[i].onclick=function(){this.classList.toggle('flipped');};}
var speaks=document.querySelectorAll('.speak');
for(i=0;i<speaks.length;i++){speaks[i].onclick=function(e){e.stopPropagation();if('speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(this.getAttribute('data-text')));};};}
var favs=document.querySelectorAll('.fav');
for(i=0;i<favs.length;i++){favs[i].onclick=function(e){e.stopPropagation();var card=this.closest('.card');if(card){card.classList.toggle('favourite');}var t=this.getAttribute('data-title');if(favourites.indexOf(t)===-1){favourites.push(t);}else{favourites.splice(favourites.indexOf(t),1);};};}
 document.getElementById('reflect').onclick=function(){var r=prompt('Why are these important?');if(r){responses.push({category:cat,text:r,date:new Date().toLocaleString()});}};
 document.getElementById('reshuffle').onclick=function(){draw(cat);};
 document.getElementById('homeBtn').onclick=home;
}catch(err){app.innerHTML='<h2>Error</h2><p>'+err.message+'</p>';}}
function report(){var h='<h2>Participant Summary Report</h2>';h+='<div class="report"><h3>Favourite Cards</h3>'+(favourites.length?favourites.join(', '):'None selected')+'</div>';h+='<div class="report"><h3>Reflections</h3>';for(var i=0;i<responses.length;i++){h+='<p><strong>'+responses[i].category+':</strong> '+responses[i].text+' <em>('+responses[i].date+')</em></p>';}h+='</div><div class="report"><h3>Session History</h3>';for(var i=0;i<sessionHistory.length;i++){h+='<p><strong>'+sessionHistory[i].category+':</strong> '+sessionHistory[i].cards.join(', ')+'</p>';}h+='</div><button id="homeBtn2">Home</button>';app.innerHTML=h;document.getElementById('homeBtn2').onclick=home;}
home();
</script>
</body>
</html>
